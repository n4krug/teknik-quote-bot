<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quote bot</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #16181d;
        color: #e8e8ea;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      main {
        width: min(32rem, calc(100vw - 3rem));
        text-align: center;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0 0 1.5rem;
        color: #9aa0aa;
        text-transform: uppercase;
      }

      button {
        font: inherit;
        font-weight: 600;
        padding: 0.85rem 2rem;
        border: 0;
        border-radius: 999px;
        background: #5865f2;
        color: #fff;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #4752c4;
      }

      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      blockquote {
        margin: 2rem 0 0;
        font-size: 1.25rem;
        white-space: pre-wrap;
      }

      blockquote:empty {
        display: none;
      }

      cite {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.9rem;
        font-style: normal;
        color: #9aa0aa;
      }

      cite:empty {
        display: none;
      }

      p.status {
        min-height: 1.5rem;
        margin: 1.25rem 0 0;
        font-size: 0.9rem;
        color: #9aa0aa;
      }

      p.status[data-error="true"] {
        color: #f28b82;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Quote bot</h1>
      <button id="speak" type="button">Speak a quote</button>
      <blockquote id="quote"></blockquote>
      <cite id="author"></cite>
      <p id="status" class="status"></p>
    </main>

    <script>
      const button = document.getElementById('speak');
      const quoteEl = document.getElementById('quote');
      const authorEl = document.getElementById('author');
      const statusEl = document.getElementById('status');
      const audio = new Audio();

      function status(message, isError) {
        statusEl.textContent = message;
        statusEl.dataset.error = isError ? 'true' : 'false';
      }

      async function speak() {
        button.disabled = true;
        status('Fetching a quote…', false);

        try {
          const response = await fetch('/speak?mode=audio', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: '{}',
          });

          if (!response.ok) {
            const detail = await response.json().catch(() => null);
            throw new Error(detail?.error ?? `Request failed with status ${response.status}.`);
          }

          const text = response.headers.get('x-quote-text');
          const author = response.headers.get('x-quote-author');

          quoteEl.textContent = text ? decodeURIComponent(text) : '';
          authorEl.textContent = author ? `— ${decodeURIComponent(author)}` : '';

          audio.src = URL.createObjectURL(await response.blob());
          status('Playing…', false);
          await audio.play();
          status('', false);
        } catch (error) {
          status(error instanceof Error ? error.message : String(error), true);
        } finally {
          button.disabled = false;
        }
      }

      button.addEventListener('click', () => void speak());
    </script>
  </body>
</html>
