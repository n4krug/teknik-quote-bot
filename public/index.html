<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Citatbot</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #16181d;
        color: #e8e8ea;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      main {
        width: min(32rem, calc(100vw - 3rem));
        text-align: center;
      }

      [hidden] {
        display: none !important;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0 0 1.5rem;
        color: #9aa0aa;
        text-transform: uppercase;
      }

      button {
        font: inherit;
        font-weight: 600;
        padding: 0.85rem 2rem;
        border: 0;
        border-radius: 999px;
        background: #5865f2;
        color: #fff;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #4752c4;
      }

      .buttons {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      button.secondary {
        background: #34373d;
      }

      button.secondary:hover:not(:disabled) {
        background: #3f434a;
      }

      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      blockquote {
        margin: 2rem 0 0;
        font-size: 1.25rem;
        white-space: pre-wrap;
      }

      blockquote:empty {
        display: none;
      }

      cite {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.9rem;
        font-style: normal;
        color: #9aa0aa;
      }

      cite:empty {
        display: none;
      }

      form#unlock {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
      }

      form#unlock input {
        font: inherit;
        padding: 0.8rem 1rem;
        border: 1px solid #34373d;
        border-radius: 999px;
        background: #1e2026;
        color: inherit;
      }

      form#unlock input:focus {
        outline: 2px solid #5865f2;
        outline-offset: 1px;
      }

      p.status {
        min-height: 1.5rem;
        margin: 1.25rem 0 0;
        font-size: 0.9rem;
        color: #9aa0aa;
      }

      p.status[data-error="true"] {
        color: #f28b82;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Citatbot</h1>

      <form id="unlock" hidden>
        <input id="passphrase" type="password" placeholder="Lösenfras" autocomplete="current-password" />
        <button type="submit">Lås upp</button>
      </form>

      <div id="app" hidden>
        <div class="buttons">
          <button id="speak" type="button">Läs upp ett citat</button>
          <button id="replay" class="secondary" type="button" hidden>Lyssna igen</button>
        </div>
        <blockquote id="quote"></blockquote>
        <cite id="author"></cite>
      </div>

      <p id="status" class="status"></p>
    </main>

    <script>
      const button = document.getElementById('speak');
      const replayButton = document.getElementById('replay');
      const quoteEl = document.getElementById('quote');
      const authorEl = document.getElementById('author');
      const statusEl = document.getElementById('status');
      const unlockForm = document.getElementById('unlock');
      const passphraseEl = document.getElementById('passphrase');
      const appEl = document.getElementById('app');
      const audio = new Audio();

      const PASSPHRASE_KEY = 'quote-bot-passphrase';
      let passphrase = sessionStorage.getItem(PASSPHRASE_KEY) ?? '';

      function status(message, isError) {
        statusEl.textContent = message;
        statusEl.dataset.error = isError ? 'true' : 'false';
      }

      function headers() {
        const result = { 'content-type': 'application/json' };
        if (passphrase) result['x-passphrase'] = passphrase;
        return result;
      }

      function showApp() {
        unlockForm.hidden = true;
        appEl.hidden = false;
      }

      function showUnlock() {
        passphrase = '';
        sessionStorage.removeItem(PASSPHRASE_KEY);
        appEl.hidden = true;
        unlockForm.hidden = false;
        passphraseEl.focus();
      }

      async function request(path, options) {
        const response = await fetch(path, options);

        if (response.status === 401) {
          showUnlock();
          throw new Error('Fel lösenfras.');
        }

        return response;
      }

      async function start() {
        const config = await (await fetch('/config')).json();
        if (config.passphraseRequired && !passphrase) showUnlock();
        else showApp();
      }

      async function unlock(event) {
        event.preventDefault();
        passphrase = passphraseEl.value;
        status('Kontrollerar…', false);

        try {
          await request('/unlock', { method: 'POST', headers: headers(), body: '{}' });
          sessionStorage.setItem(PASSPHRASE_KEY, passphrase);
          passphraseEl.value = '';
          status('', false);
          showApp();
        } catch (error) {
          status(error instanceof Error ? error.message : String(error), true);
        }
      }

      async function speak() {
        button.disabled = true;
        status('Hämtar ett citat…', false);

        try {
          const response = await request('/speak?mode=audio', {
            method: 'POST',
            headers: headers(),
            body: '{}',
          });

          if (!response.ok) {
            const detail = await response.json().catch(() => null);
            throw new Error(detail?.error ?? `Kunde inte hämta citat (status ${response.status}).`);
          }

          const text = response.headers.get('x-quote-content');
          const author = response.headers.get('x-quote-author');

          quoteEl.textContent = text ? decodeURIComponent(text) : '';
          authorEl.textContent = author ? `— ${decodeURIComponent(author)}` : '';

          audio.src = URL.createObjectURL(await response.blob());
          replayButton.hidden = false;
          status('Spelar…', false);
          await audio.play();
          status('', false);
        } catch (error) {
          status(error instanceof Error ? error.message : String(error), true);
        } finally {
          button.disabled = false;
        }
      }

      async function replay() {
        replayButton.disabled = true;

        try {
          audio.currentTime = 0;
          await audio.play();
          status('', false);
        } catch (error) {
          status(error instanceof Error ? error.message : String(error), true);
        } finally {
          replayButton.disabled = false;
        }
      }

      button.addEventListener('click', () => void speak());
      replayButton.addEventListener('click', () => void replay());
      unlockForm.addEventListener('submit', (event) => void unlock(event));
      void start();
    </script>
  </body>
</html>
